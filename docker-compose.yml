services:
  easupso_portal_db:
    image: postgres:16-alpine
    container_name: easupso_portal_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-easupso_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-easupso_portal}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - easupso_portal_pgdata:/var/lib/postgresql/data
    networks:
      - easupso_internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-easupso_admin} -d ${DB_NAME:-easupso_portal}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # CẢNH BÁO: TUYỆT ĐỐI KHÔNG map port 5432 ra ngoài host để đảm bảo nguyên tắc Zero-Trust nội bộ.

  easupso_portal_web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: easupso_portal_web
    restart: always
    env_file:
      - .env
    volumes:
      - ./public/uploads:/app/public/uploads
      - ./public/site-settings.json:/app/public/site-settings.json
      - ./public/local-articles.json:/app/public/local-articles.json
    depends_on:
      easupso_portal_db:
        condition: service_healthy
    networks:
      - easupso_internal_net
    ports:
      - "3008:3000"

  dozzle:
    image: amir20/dozzle:latest
    container_name: easupso_portal_dozzle
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - easupso_internal_net
    # Giám sát log nội bộ, truy cập thông qua internal network hoặc cấu hình bảo mật reverse proxy

networks:
  easupso_internal_net:
    driver: bridge
    name: easupso_internal_net

volumes:
  easupso_portal_pgdata:
    name: easupso_portal_pgdata
